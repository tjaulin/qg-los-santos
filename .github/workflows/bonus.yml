name: Bonus de la semaine

# Met à jour bonus.json chaque jeudi après la mise à jour hebdo de GTA Online
# (≈ 10 h UTC), avec deux rattrapages si la page source n'était pas encore à jour.
# Lancement manuel : onglet Actions → « Bonus de la semaine » → Run workflow.
on:
  schedule:
    - cron: '30 11 * * 4'
    - cron: '0 16 * * 4'
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bonus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les bonus
        run: node scripts/update-bonus.mjs

      - name: Publier si quelque chose a changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bonus.json; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bonus.json
          git commit -m "Bonus de la semaine ($(date -u +%F))"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "Le site sera republié au prochain build GitHub Pages."
